      <button class="tecla" data-tecla="2">2</button>
      <button class="tecla" data-tecla="3">3</button>

      <button class="tecla tecla-vacia" disabled></button>
      <button class="tecla" data-tecla="0">0</button>
      <button class="tecla" data-tecla="borrar" aria-label="Borrar">⌫</button>
    </div>
  </div>
</section>

<!-- ───────── Asistente de primer uso ───────── -->

<!-- ───────── App ───────── -->
<div id="app" class="oculto">
  <main id="contenido" class="contenido" tabindex="-1"></main>

  <!-- Botón grande para registrar cualquier cosa en 2 toques -->
  <button id="boton-mas" class="boton-mas" aria-label="Registrar algo">+</button>

  <nav class="barra-inferior" aria-label="Secciones">
    <button class="pestania" data-vista="hoy"><span aria-hidden="true">☀️</span>Hoy</button>

    <button class="pestania" data-vista="chat"><span aria-hidden="true">💬</span>Hablar</button>
    <button class="pestania" data-vista="resumen"><span aria-hidden="true">🌱</span>Ti</button>
  </nav>
</div>

<!-- Hoja inferior reutilizable para todos los formularios -->
<div id="hoja-fondo" class="hoja-fondo oculto"></div>
<section id="hoja" class="hoja oculto" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
  <div class="hoja-asa" aria-hidden="true"></div>
  <h2 id="hoja-titulo" class="hoja-titulo"></h2>
  <div id="hoja-cuerpo"></div>
</section>

<!-- Avisos amables, nunca modales de error -->
<div id="brindis" class="brindis oculto" role="status" aria-live="polite"></div>

<!-- ───────── Rompe-cachés de construcción ─────────
     Va aquí, en el HTML, y no en app.js, a propósito: el service
     worker guardaba los .js y los servía viejos, así que un arreglo
     dentro de app.js nunca llegaba a ejecutarse. El HTML sí baja
     siempre de la red, de modo que esto rompe el círculo.

     Se quita al lanzar la app, junto con el modo construcción. -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    if (!regs.length) return;
    return Promise.all(regs.map(function (r) { return r.unregister(); }))
      .then(function () {
        if (!window.caches) return null;
        return caches.keys().then(function (claves) {
          return Promise.all(claves.map(function (k) { return caches.delete(k); }));
        });
      })
      .then(function () {
        // Una sola recarga: los .js de ESTA carga ya salieron de la
        // caché vieja. El candado evita quedarse recargando en bucle.
        try {
          if (sessionStorage.getItem('calma.recarga') === '1') return;
          sessionStorage.setItem('calma.recarga', '1');
        } catch (e) { return; }
        location.reload();
      });
  }).catch(function () {});
})();
</script>

<!-- ───────── Soplón de construcción ─────────
     Si algo revienta, se ve EN LA PANTALLA en vez de esconderse en
     una consola que en el teléfono nadie puede abrir. Sin esto, un
     error deja un botón que "no hace nada" y a adivinar.
     Se quita al lanzar la app. -->
<script>
(function () {
  function avisar(texto) {
    var caja = document.getElementById('soplon');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'soplon';
      caja.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:999;'
        + 'background:#3a2a20;color:#f0d9c8;font:12px/1.4 monospace;'
        + 'padding:10px 12px;white-space:pre-wrap;max-height:40vh;overflow:auto;'
        + 'border-top:2px solid #e8955c';
      (document.body || document.documentElement).appendChild(caja);
    }
    caja.textContent = texto;
  }
  window.addEventListener('error', function (e) {
    avisar('FALLO: ' + e.message + '
' + (e.filename || '').split('/').pop() + ':' + e.lineno);
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    avisar('FALLO (promesa): ' + ((r && (r.stack || r.message)) || r));
  });
  window.__soplon = avisar;
})();
</script>
